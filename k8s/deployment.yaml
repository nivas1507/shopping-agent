apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shopping-agent-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-agent
spec:
  replicas: 2            # both pods share one SQLite volume (see notes)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shopping-agent
  template:
    metadata:
      labels:
        app: shopping-agent
    spec:
      containers:
        - name: shopping-agent
          image: shopping-agent-shopping-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: shopping-agent-env
          volumeMounts:
            - name: data
              mountPath: /app/resources
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shopping-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-agent
spec:
  type: NodePort
  sessionAffinity: ClientIP   # keep a browser session on one pod (Streamlit state)
  selector:
    app: shopping-agent
  ports:
    - port: 80
      targetPort: 8501
      nodePort: 30080
