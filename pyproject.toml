[project]
name = "shopping-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[tool.ruff.lint]
# Bug-finding rules only (syntax errors, undefined names, unused imports, etc.)
select = ["E4", "E7", "E9", "F"]
